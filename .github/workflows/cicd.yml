name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - name: web
            context: .
            image: crabs3
          - name: cron
            context: ./cron
            image: crabs3-cron
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          platforms: linux/amd64

  build_pr:
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    concurrency:
      group: ${{ github.event.pull_request.number }}
      cancel-in-progress: true
    strategy:
      matrix:
        include:
          - name: web
            context: .
            image: crabs3
          - name: cron
            context: ./cron
            image: crabs3-cron
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:pr-${{ github.event.pull_request.number }}
          platforms: linux/amd64

  update_latest:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        image: [crabs3, crabs3-cron]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Update ${{ matrix.image }} latest tag
        run: |
          docker pull ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          docker tag ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }} ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest

  deploy:
    runs-on: self-hosted
    needs: [update_latest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_APP_DIR }}
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/crabs3:${{ github.sha }}
            docker compose -f compose.yml up -d --force-recreate
            until [ "$(docker inspect -f '{{.State.Health.Status}}' crabs3)" = "healthy" ]; do
              echo "Waiting for web container to be healthy..."
              sleep 5
            done
            docker-compose exec -T web npx prisma migrate deploy
