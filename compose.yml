services:
  db:
    image: postgres:latest
    container_name: crabs3-db
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: crabs3
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - crabs3-network

  clamav:
    image: clamav/clamav:stable
    container_name: crabs3-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
      - CLAMAV_NO_CLAMD=false
      - CLAMD_CONF_ScanArchive=true
      - CLAMD_CONF_ScanOLE2=true
      - CLAMD_CONF_ScanPDF=true
      - CLAMD_CONF_ScanXMLDOCS=true
      - CLAMD_CONF_MaxRecursion=10
      - CLAMD_CONF_StreamMaxLength=1900M
      - CLAMD_CONF_MaxFileSize=1900M
      - CLAMD_CONF_MaxScanSize=1900M
      - CLAMD_CONF_AlertBrokenExecutables=true
      - CLAMD_CONF_ReadTimeout=600
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - crabs3-network
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  web:
    depends_on:
      db:
        condition: service_started
      clamav:
        condition: service_healthy
    build: .
    ports:
      - "3000:3000"
    container_name: crabs3
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/crabs3
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    networks:
      - crabs3-network
      - mail-network # Connect to external mail network for sending emails
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cron:
    build:
      context: ./cron
    depends_on:
      web:
        condition: service_healthy
    container_name: crabs3-cron
    env_file:
      - .env
    environment:
      APP_INTERNAL_URL: http://web:3000
    restart: unless-stopped

networks:
  crabs3-network:
    driver: bridge
  mail-network:
    external: true

volumes:
  db-data:
    driver: local
  clamav_data:
